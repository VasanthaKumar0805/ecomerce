    <title>ecommerce</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

<body>
    <nav class="navbar">
        <h1>NOSTRA</h1>

        <div class="navbar-links">
            <p class="navbar-link"><a href="index.html">Home</a></p>
            <p class="navbar-link"><a href="collection.html">collections</a></p>
            <p class="navbar-link"><a href="contact.html">contacts</a></p>
        </div>


        <div class="navbar-menu-toggle" onclick="showNavbar()">
            <i class="fa-solid fa-bars"></i>
        </div>

    </nav>

    <div class="side-navbar">
        <p style="text-align: right;" onclick="closeNavbar()">
            <i class="fa-solid fa-xmark"></i>

        <div class="side-navbar-links">

            <p class="side-navbar-link"><a href="contact.html">contacts</a></p>
        </div>
    </div>

    <!-- product -->
     <div class="product-section">
        <form class="product-search">

        </form>

        <div class="products" id="products">

            <div class="product-box">
                <img src="./images/white-shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">
                <p>White Shirt</p>
            </div>

            <div class="product-box">
                <img src="./images/black-shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">
                <p>Black Shirt</p>
            </div>

            <div class="product-box">
                <img src="./images/green-shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">

            </div>

            <div class="product-box">
                <img src="./images/gray-shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">

            </div>

            <div class="product-box">
                <img src="./images/orange-shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">

            </div>

            <div class="product-box">
                <img src="./images/lightblue-shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">
                <p>Lightblue Shirt</p>
            </div>

            <div class="product-box">
                <img src="./images/navy-blue shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">
                <p>Navyblue Shirt</p>
            </div>

            <div class="product-box">
                <img src="./images/red-shirt.jpg" alt="" style="width: 200px; height: 200px; border-radius: 10px;">

        </div>

     </div>

     <div class="footer">
        <div class="footer-container">
            <div class="footer-box-1">
                <h2 class="heading-text">NOSTRA</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat, dignissimos?</p>
                <div class="icon-container">
                    <i class="fa-brands fa-instagram" style="color: #ffffff;"></i>
                    <i class="fa-brands fa-twitter" style="color: #ffffff;"></i>
                    <i class="fa-brands fa-facebook" style="color: #ffffff;"></i>
                </div>
            </div>
        </div>
